<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — Tu Viaje Musical</title>
  <meta name="description" content="¿Tienes alguna pregunta sobre la Agenda Instrumental o quieres escribir a Tu Viaje Musical? Rellena el formulario de contacto.">

  <!-- Tipografías de marca: Poppins (títulos) y Quicksand (texto) -->
  <!-- Favicon: icono de la marca en la pestaña del navegador -->
  <link rel="icon" type="image/png" href="assets/images/logo-icono.png">
  <link rel="apple-touch-icon" href="assets/images/logo-icono.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body class="page--column">

  <!-- ============ NAV ============ -->
  <!-- El nav de esta página no es "sticky" (a diferencia de Inicio y
       Agenda): es la única sección, no hace falta que seas fijo. -->
  <nav class="nav nav--static">
    <a href="index.html" class="nav__brand">
      <img class="nav__logo" src="assets/images/logo-horizontal.png" alt="Tu Viaje Musical">
    </a>
    <div class="nav__actions">
      <a href="producto.html" class="btn btn--outline">Agenda</a>
    </div>
  </nav>

  <main>
    <section style="padding:40px 24px 56px; overflow:hidden;">
      <span class="hero__glyph" aria-hidden="true" style="top:36px; left:28px; font-size:60px; color:var(--aqua); opacity:0.3; transform:rotate(-10deg);">♪</span>
      <div class="hero__blob hero__blob--lilac" aria-hidden="true" style="top:-70px; right:-70px; width:230px; height:230px; opacity:0.75;"></div>

      <div style="position:relative; max-width:480px; margin:0 auto;">
        <h1 class="product-hero__title text-center">Contacto</h1>
        <p class="product-hero__desc text-center">¿Tienes alguna pregunta o quieres escribirme? Rellena el formulario y te respondo en cuanto pueda.</p>

        <!-- EDITAR: si algún día cambias de formulario en Forminit, actualiza
             el ID en js/main.js (busca 'rgi42zi55jg') -->
        <form id="contact-form" class="contact-form">
          <label for="contacto-nombre">
            <span>Nombre</span>
            <input type="text" id="contacto-nombre" name="fi-sender-fullName" required>
          </label>
          <label for="contacto-email">
            <span>Email</span>
            <input type="email" id="contacto-email" name="fi-sender-email" required>
          </label>
          <label for="contacto-asunto">
            <span>Asunto</span>
            <input type="text" id="contacto-asunto" name="fi-text-asunto">
          </label>
          <label for="contacto-mensaje">
            <span>Mensaje</span>
            <textarea id="contacto-mensaje" name="fi-text-mensaje" rows="5" required></textarea>
          </label>
          <button type="submit" class="btn btn--primary">Enviar mensaje</button>
          <p id="contact-status" class="contact-form__status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <img class="site-footer__logo" src="assets/images/logo-icono.png" alt="Tu Viaje Musical">
    <div class="site-footer__links">
      <a href="index.html">Inicio</a>
      <a href="producto.html">Agenda</a>
    </div>
    <p class="site-footer__year">© <span id="anio-actual">2026</span> Tu Viaje Musical</p>
  </footer>

  <!-- SDK de Forminit, para que el formulario de contacto funcione -->
  <script src="https://forminit.com/sdk/v1/forminit.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
