<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Contacto — Tu Viaje Musical</title>
  <meta name="description" content="Contacta con Tu Viaje Musical si tienes alguna pregunta.">

  <link rel="icon" type="image/png" href="assets/images/logo-icono.png">
  <link rel="apple-touch-icon" href="assets/images/logo-icono.png">

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600&family=Quicksand:wght@400;500;600;700&display=swap" rel="stylesheet">

  <link rel="stylesheet" href="css/style.css">
</head>
<body style="display:flex; flex-direction:column; min-height:100vh;">

  <!-- ============ NAV ============ -->
  <nav class="nav">
    <a href="index.html" class="nav__brand">
      <img class="nav__logo-img" src="assets/images/logo-horizontal.png" alt="Tu Viaje Musical">
    </a>
    <a href="producto.html" class="btn btn--outline">Agenda</a>
  </nav>

  <main style="flex:1; position:relative;">
    <section style="padding:40px 24px 56px; position:relative; overflow:hidden;">
      <div class="hero__blob hero__blob--lilac" aria-hidden="true" style="top:-70px; right:-70px; width:230px; height:230px; opacity:0.75;"></div>
      <span class="hero__glyph" aria-hidden="true" style="top:36px; left:28px; font-size:60px; color:var(--aqua); opacity:0.3; transform:rotate(-10deg);">♪</span>

      <div style="position:relative; max-width:480px; margin:0 auto;">
        <h1 class="hero__title" style="text-align:center;">Contacto</h1>
        <p style="font-size:17px; line-height:1.6; color:var(--ink-soft); text-align:center; margin-bottom:32px;">¿Tienes alguna pregunta o quieres escribirme? Rellena el formulario y te respondo en cuanto pueda.</p>

        <!-- EDITAR: si algún día cambias de formulario en Forminit, actualiza
             el ID en js/main.js (busca 'rgi42zi55jg') -->
        <form id="contact-form" class="contact-form" style="background:var(--surface); border-radius:24px; padding:26px 22px;">
          <div>
            <label for="contacto-nombre">Nombre</label>
            <input type="text" id="contacto-nombre" name="fi-sender-fullName" required>
          </div>
          <div>
            <label for="contacto-email">Email</label>
            <input type="email" id="contacto-email" name="fi-sender-email" required>
          </div>
          <div>
            <label for="contacto-asunto">Asunto</label>
            <input type="text" id="contacto-asunto" name="fi-text-asunto">
          </div>
          <div>
            <label for="contacto-mensaje">Mensaje</label>
            <textarea id="contacto-mensaje" name="fi-text-mensaje" rows="5" required></textarea>
          </div>
          <button type="submit" class="btn btn--primary" style="width:100%; margin-top:4px;">Enviar mensaje</button>
          <p id="contact-status" class="contact-form__status" aria-live="polite"></p>
        </form>
      </div>
    </section>
  </main>

  <!-- ============ FOOTER ============ -->
  <footer class="site-footer">
    <img class="site-footer__logo" src="assets/images/logo-icono.png" alt="Tu Viaje Musical">
    <div class="site-footer__links">
      <a href="index.html">Inicio</a>
      <a href="producto.html">Agenda Instrumental</a>
    </div>
    <p class="site-footer__year">© <span id="anio-actual">2026</span> Tu Viaje Musical</p>
  </footer>

  <!-- SDK de Forminit, para que este formulario funcione -->
  <script src="https://forminit.com/sdk/v1/forminit.js"></script>
  <script src="js/main.js"></script>
</body>
</html>
